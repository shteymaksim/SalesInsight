<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Page</title>
  <style>
    body {
      background-color: #0f172a;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      background: #1e293b;
      padding: 40px;
      border-radius: 16px;
      border: 2px solid #6366f1;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
    }
    h1 { color: #34d399; font-size: 24px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>САЙТ УСПЕШНО РАБОТАЕТ!</h1>
    <p>Vercel віддає сторінку. Зараз підключимо логіку.</p>
  </div>
</body>
</html>
