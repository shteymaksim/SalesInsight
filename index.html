  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --ink: #263449;
      --muted: #77859a;
      --line: #e5ebf2;
      --blue: #527da8;
      --blue-dark: #3e668f;
      --blue-soft: #eaf2f9;
      --green: #39866d;
      --green-soft: #e8f4ee;
      --amber: #b98238;
      --amber-soft: #fbf2e5;
      --red: #bd6464;
      --red-soft: #faeded;
      --shadow: 0 12px 34px rgba(40, 62, 88, .07);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex; flex-direction: column;
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .topbar {
      position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.92);
      border-bottom: 1px solid var(--line); backdrop-filter: blur(14px);
    }
    .topbar-inner {
      max-width: 1240px; margin: auto; padding: 13px 22px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center;
      color: #fff; font-size: 20px; font-weight: 800;
      background: linear-gradient(145deg, #7da7c8, #527da8);
      box-shadow: 0 7px 16px rgba(82,125,168,.2);
    }
    .brand h1 { margin: 0; font-size: 17px; letter-spacing: -.3px; }
    .brand p { margin: 3px 0 0; color: var(--muted); font-size: 11px; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .user-chip {
      display: flex; align-items: center; gap: 9px; border: 1px solid #dcebe3;
      color: var(--green); background: var(--green-soft); padding: 7px 10px;
      border-radius: 999px; font-size: 12px; max-width: 280px;
    }
    .user-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    main { width: min(1240px, 100%); margin: 0 auto; padding: 34px 22px 56px; flex: 1; }
    .card {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 24px;
    }
    .auth-card { max-width: 440px; margin: 38px auto; padding: 30px; }
    .eyebrow { color: var(--blue); font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h2, h3, p { overflow-wrap: anywhere; }
    .auth-card h2 { margin: 8px 0 7px; font-size: 24px; letter-spacing: -.7px; }
    .subtext { color: var(--muted); font-size: 13px; line-height: 1.55; }
    label { display: block; margin: 15px 0 6px; color: #65748a; font-size: 12px; font-weight: 700; }
    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%; padding: 12px 13px; border: 1px solid #dfe6ee; border-radius: 10px;
      background: #fbfcfe; color: var(--ink); outline: none; transition: .18s;
    }
    input:focus { border-color: #8eafca; box-shadow: 0 0 0 3px rgba(82,125,168,.12); }
