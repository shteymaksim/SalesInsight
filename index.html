<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales Pulse AI — Аналітик штучних продажів</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- html2canvas for image generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
    header { border-bottom: 1px solid #1e293b; background: rgba(15, 23, 42, 0.9); position: sticky; top: 0; z-index: 50; backdrop-filter: blur(10px); }
    .header-container { max-width: 1200px; margin: 0 auto; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    main { max-width: 1200px; margin: 0 auto; padding: 32px 16px; flex-grow: 1; width: 100%; }
    .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); }
    .btn { background: #4f46e5; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; font-size: 14px; }
    .btn:hover { background: #4338ca; }
    .btn-secondary { background: #1e293b; border: 1px solid #334155; color: #cbd5e1; }
    .btn-secondary:hover { background: #334155; color: white; }
    input { width: 100%; background: #090d16; border: 1px solid #334155; border-radius: 8px; padding: 10px 12px; color: white; font-size: 14px; margin-top: 4px; margin-bottom: 16px; outline: none; }
    input:focus { border-color: #6366f1; }
    label { font-size: 12px; color: #94a3b8; font-weight: 500; display: block; }
    .hidden { display: none !important; }
    table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 16px; }
    th, td { padding: 12px 16px; border-bottom: 1px solid #1e293b; font-size: 14px; }
    th { background: rgba(15, 23, 42, 0.8); color: #94a3b8; text-transform: uppercase; font-size: 11px; }
    footer { border-top: 1px solid #1e293b; padding: 16px; text-align: center; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, #6366f1, #3b82f6); display: flex; align-items: center; justify-content: center; font-size: 20px; color: white;">
          <i class="fa-solid fa-chart-line"></i>
        </div>
        <div>
          <h1 style="font-size: 16px; font-weight: 700;">Sales Pulse AI</h1>
          <p style="font-size: 11px; color: #94a3b8;">Аналіз штучних продажів та конверсії</p>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <div id="user-badge" class="hidden" style="font-size: 12px; color: #34d399; background: rgba(5,150,105,0.2); padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(5,150,105,0.4);">
          <span id="user-email-display"></span>
          <button id="logout-btn" style="background:none; border:none; color:#f43f5e; cursor:pointer; margin-left:8px;"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
        <button id="open-config-btn" class="btn btn-secondary" style="padding: 6px 12px; font-size: 12px;">Supabase</button>
      </div>
    </div>
  </header>

  <main>
    <!-- AUTH CONTAINER -->
    <section id="auth-container" class="card" style="max-width: 400px; margin: 0 auto;">
      <h2 style="font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 8px;">Авторизація</h2>
      <p style="font-size: 12px; color: #94a3b8; text-align: center; margin-bottom: 24px;">Увійдіть для збереження звітів</p>
      
      <div>
        <label>Email</label>
        <input type="email" id="auth-email" placeholder="manager@company.com" />
        <label>Пароль</label>
        <input type="password" id="auth-password" placeholder="••••••••" />
        <div style="display: flex; gap: 10px;">
          <button type="button" id="login-btn" class="btn" style="flex:1;">Увійти</button>
          <button type="button" id="register-btn" class="btn btn-secondary" style="flex:1;">Реєстрація</button>
        </div>
      </div>
      <div id="auth-msg" style="margin-top: 16px; font-size: 12px; text-align: center; color: #38bdf8;"></div>
    </section>

    <!-- WORKSPACE -->
    <div id="workspace" class="hidden">
      <div style="display: flex; gap: 10px; margin-bottom: 24px;">
        <button id="tab-new-btn" class="btn" style="width: auto;">Новий аналіз</button>
        <button id="tab-history-btn" class="btn btn-secondary" style="width: auto;">Історія звітів</button>
      </div>

      <!-- VIEW NEW -->
      <div id="view-new" class="space-y-6">
        <div class="card" style="margin-bottom: 24px;">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: center;">
            <div id="drop-zone" style="border: 2px dashed #6366f1; border-radius: 12px; padding: 32px; text-align: center; cursor: pointer; background: rgba(15, 23, 42, 0.4);">
              <input type="file" id="file-input" accept="image/*" class="hidden" />
              <i class="fa-solid fa-paste" style="font-size: 24px; color: #6366f1; margin-bottom: 8px;"></i>
              <p style="font-size: 14px; font-weight: 600;">Натисніть Ctrl + V або виберіть файл</p>
              <p style="font-size: 11px; color: #94a3b8; margin-top: 4px;">Скриншот таблиці продажів</p>
            </div>
            <div>
              <label>Google Gemini API Key</label>
